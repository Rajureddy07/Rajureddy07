<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Data, Software, Applied AI</title>
  <desc id="desc">A minimal dark navy profile banner with teal and blue accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="60%" stop-color="#111E32"/>
      <stop offset="100%" stop-color="#102F3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55E6C1"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#A7C7D9" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1010" cy="42" r="165" fill="#60A5FA" opacity=".08"/>
  <circle cx="1090" cy="260" r="230" fill="#55E6C1" opacity=".07"/>
  <path d="M770 250 C850 180 910 215 980 140 S1100 110 1200 40" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".45"/>
  <path d="M770 275 C850 205 910 240 980 165 S1100 135 1200 65" fill="none" stroke="url(#accent)" stroke-width="1" stroke-opacity=".22"/>
  <rect x="62" y="58" width="8" height="178" rx="4" fill="url(#accent)"/>
  <text x="98" y="98" fill="#7BE7D1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">ENGINEERING PORTFOLIO</text>
  <text x="96" y="158" fill="#F5F8FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="750">DATA  /  SOFTWARE  /  AI</text>
  <text x="99" y="199" fill="#B9C8D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Building practical tools from data, code, and real-world problems.</text>
  <g fill="#DDECF4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="1.5">
    <text x="99" y="243">PYTHON</text><circle cx="183" cy="238" r="2.5" fill="#55E6C1"/>
    <text x="199" y="243">SQL</text><circle cx="247" cy="238" r="2.5" fill="#55E6C1"/>
    <text x="263" y="243">ANALYTICS</text><circle cx="363" cy="238" r="2.5" fill="#55E6C1"/>
    <text x="379" y="243">APPLIED AI</text>
  </g>
</svg>